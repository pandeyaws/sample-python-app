<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Sample Python app deployment flow</title>
  <desc id="desc">GitHub Actions builds a tagged image and updates the Argo CD ApplicationSet target revision. Argo CD deploys development first, then production after development is healthy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526174"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .step { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .repo { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .deploy { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .line { fill: none; stroke: #526174; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f1f5f9"/>
  <text x="48" y="52" class="title">Sample Python App — Application Deployment</text>

  <text x="48" y="96" class="section">1 · BUILD AND RELEASE</text>
  <rect x="48" y="116" width="270" height="94" rx="12" class="card"/>
  <text x="183" y="154" text-anchor="middle" class="head">Change merged</text>
  <text x="183" y="181" text-anchor="middle" class="body">to master</text>

  <path d="M318 163 H365" class="line"/>
  <rect x="370" y="116" width="365" height="94" rx="12" class="step"/>
  <text x="552" y="151" text-anchor="middle" class="head">GitHub Actions</text>
  <text x="552" y="180" text-anchor="middle" class="body">Test · calculate version · build image</text>

  <path d="M735 163 H780" class="line"/>
  <rect x="785" y="116" width="345" height="94" rx="12" class="card"/>
  <text x="957" y="151" text-anchor="middle" class="head">Versioned build outputs</text>
  <text x="957" y="180" text-anchor="middle" class="body">Container image + source Git tag</text>

  <path d="M1130 163 H1175" class="blue"/>
  <rect x="1180" y="116" width="370" height="94" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="1365" y="151" text-anchor="middle" class="head">Push image to ACR</text>
  <text x="1365" y="180" text-anchor="middle" class="body">sample-python-app:&lt;release-tag&gt;</text>

  <text x="48" y="260" class="section">2 · REPOSITORIES AND ARGO CD CONFIGURATION</text>
  <rect x="48" y="280" width="470" height="230" rx="14" class="repo"/>
  <text x="74" y="318" class="head">sample-python-app</text>
  <text x="74" y="346" class="small">Application source repository</text>
  <rect x="74" y="370" width="195" height="88" rx="10" class="card"/>
  <text x="171" y="405" text-anchor="middle" class="body">FastAPI source</text>
  <text x="171" y="432" text-anchor="middle" class="small">app/ · tests/</text>
  <rect x="294" y="370" width="198" height="88" rx="10" class="card"/>
  <text x="393" y="405" text-anchor="middle" class="body">Helm chart</text>
  <text x="393" y="432" text-anchor="middle" class="small">chart + env values</text>
  <text x="74" y="485" class="small">Chart and values are read at targetRevision.</text>

  <rect x="565" y="280" width="470" height="230" rx="14" class="repo"/>
  <text x="591" y="318" class="head">sample-python-app-argocd</text>
  <text x="591" y="346" class="small">ApplicationSet · generates environment apps</text>
  <rect x="591" y="370" width="195" height="88" rx="10" class="card"/>
  <text x="688" y="405" text-anchor="middle" class="body">dev</text>
  <text x="688" y="432" text-anchor="middle" class="small">targetRevision: tag</text>
  <rect x="811" y="370" width="198" height="88" rx="10" class="card"/>
  <text x="910" y="405" text-anchor="middle" class="body">prd</text>
  <text x="910" y="432" text-anchor="middle" class="small">targetRevision: tag</text>
  <text x="591" y="485" class="small">Revision selects chart source and matching image tag.</text>

  <rect x="1082" y="280" width="470" height="230" rx="14" class="repo"/>
  <text x="1108" y="318" class="head">scf-k8s-argocd</text>
  <text x="1108" y="346" class="small">Platform configuration repository</text>
  <rect x="1108" y="370" width="195" height="88" rx="10" class="card"/>
  <text x="1205" y="405" text-anchor="middle" class="body">Parent Application</text>
  <text x="1205" y="432" text-anchor="middle" class="small">manages ApplicationSet</text>
  <rect x="1328" y="370" width="198" height="88" rx="10" class="card"/>
  <text x="1427" y="405" text-anchor="middle" class="body">AppProject</text>
  <text x="1427" y="432" text-anchor="middle" class="small">scopes child apps</text>
  <text x="1108" y="485" class="small">Project: apps-sample-python-app</text>

  <path d="M957 210 V238 H300 V365" class="dashed"/>
  <text x="440" y="233" class="small">push release tag to app repository</text>
  <path d="M735 163 V250 H800 V365" class="blue"/>
  <text x="814" y="246" class="small">update environment targetRevision</text>
  <path d="M1205 458 V535 H800 V515" class="line"/>
  <text x="900" y="532" class="small">parent watches config repo</text>

  <text x="48" y="580" class="section">3 · DEPLOYMENT AND PROMOTION</text>
  <rect x="48" y="610" width="210" height="105" rx="12" class="step"/>
  <text x="153" y="649" text-anchor="middle" class="head">Update dev</text>
  <text x="153" y="678" text-anchor="middle" class="body">targetRevision = tag</text>

  <path d="M258 662 H303" class="line"/>
  <rect x="308" y="610" width="225" height="105" rx="12" class="card"/>
  <text x="420" y="649" text-anchor="middle" class="head">Dev Application</text>
  <text x="420" y="678" text-anchor="middle" class="body">sample-python-app-dev</text>

  <path d="M533 662 H578" class="line"/>
  <rect x="583" y="610" width="220" height="105" rx="12" class="deploy"/>
  <text x="693" y="649" text-anchor="middle" class="head">Deploy to dev</text>
  <text x="693" y="678" text-anchor="middle" class="body">Argo CD sync + image pull</text>

  <path d="M803 662 H848" class="line"/>
  <path d="M910 610 L972 662 L910 715 L848 662 Z" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="910" y="658" text-anchor="middle" class="body">Dev</text>
  <text x="910" y="679" text-anchor="middle" class="body">healthy?</text>

  <path d="M972 662 H1010" class="line"/>
  <text x="981" y="646" class="small">yes</text>
  <rect x="1015" y="610" width="205" height="105" rx="12" class="step"/>
  <text x="1117" y="649" text-anchor="middle" class="head">Update prd</text>
  <text x="1117" y="678" text-anchor="middle" class="body">targetRevision = tag</text>

  <path d="M1220 662 H1255" class="line"/>
  <rect x="1260" y="610" width="245" height="105" rx="12" class="deploy"/>
  <text x="1382" y="649" text-anchor="middle" class="head">Deploy to production</text>
  <text x="1382" y="678" text-anchor="middle" class="body">prd Application · Argo CD</text>

  <path d="M153 715 V778 H693 V720" class="blue"/>
  <text x="350" y="771" class="small">Dev and production clusters pull the same release-tagged image from ACR.</text>
  <path d="M1382 715 V800" class="line"/>
  <rect x="1240" y="805" width="285" height="76" rx="12" class="card"/>
  <text x="1382" y="851" text-anchor="middle" class="head">Create GitHub release</text>

  <path d="M910 715 V850 H600" class="dashed"/>
  <rect x="325" y="812" width="270" height="76" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="460" y="858" text-anchor="middle" class="body">If unhealthy: stop promotion</text>

  <rect x="48" y="940" width="1504" height="112" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="980" class="head">Release consistency</text>
  <text x="76" y="1012" class="body">The Git tag selects the Helm chart revision and is also used as the container image tag.</text>
  <text x="76" y="1037" class="small">Development is deployed and checked before the workflow advances production to that release.</text>
</svg>
