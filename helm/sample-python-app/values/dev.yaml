replicaCount: 1

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  hosts:
    - host: sample-python-app.services-dev.privatelink.eastus.azmk8s.io
      paths:
        - path: /
          pathType: Prefix