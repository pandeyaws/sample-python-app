name: Build and push to ACR

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read write

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: calculate next version tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          dry_run: true
      
      - name: Print version information
        run: |
          echo "Previous tag: ${{ steps.version.outputs.previous_tag }}"
          echo "Next tag: ${{ steps.version.outputs.new_tag }}"
          echo "Next version: ${{ steps.version.outputs.new_version }}"

  build-and-publish:
    env:
          ACR_NAME: acreusdev01
          ACR_LOGIN_SERVER: acreusdev01.azurecr.io
    #needs: version
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  

      - name: Verify ACR configuration        
        run: |
          test -n "$ACR_NAME" || { echo "ACR_NAME is not configured"; exit 1; }
          test -n "$ACR_LOGIN_SERVER" || { echo "ACR_LOGIN_SERVER is not configured"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/sample-python-app
          tags: |
            type=raw,value=${{ steps.version.outputs.new_tag }}
            type=raw,value=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate github apps token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          repository: "sample-python-app"

      - name: checkout with app token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: create and push release tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }} 


      