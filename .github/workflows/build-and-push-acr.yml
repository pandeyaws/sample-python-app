name: Build and push to ACR

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: calculate next version tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          dry_run: true
      
      - name: Print version information
        run: |
          echo "Previous tag: ${{ steps.version.outputs.previous_tag }}"
          echo "Next tag: ${{ steps.version.outputs.new_tag }}"
          echo "Next version: ${{ steps.version.outputs.new_version }}"

  build:
    needs: version
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Build and push image
        uses: pandeyaws/shared-templates/.github/actions/build/python@master
        with:
          python-version: "3.12"
          enable-tests: "true"
          acr_name: acreusdev01
          acr_login_server: acreusdev01.azurecr.io
          image_name: my-python-app
          image_tag: ${{ needs.version.outputs.tag }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          

      - name: Generate github apps token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          repository: "sample-python-app"

      - name: checkout with app token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: create and push release tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}

      - name: Generate github apps token
        id: argocd_token
        uses: actions/create-github-app-token@v1
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: pandeyaws
          repositories: sample-python-app-argocd
          permission-contents: write
          
  deploy-to-dev:    
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write  
    steps:
      - name: Sync ArgoCD apps
        uses: pandeyaws/shared-templates/.github/actions/deploy/argocd-sync@master
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          target_revision: ${{ needs.version.outputs.tag }}
          repo_owner: pandeyaws
          repo_name: sample-python-app-argocd
          branch: master
          appset_path: argocd/sample-python-app-appset.yaml
          environment_name: dev
          argocd_server: ${{ secrets.ARGOCD_SERVER }}
          argocd_username: ${{ secrets.ARGOCD_USERNAME }}
          argocd_password: ${{ secrets.ARGOCD_PASSWORD }}          
          parent_app: apps-sample-python-app
          child_app: sample-python-app-dev
          cert_manager_app: cert-manager
          external-secrets: external-secrets         
      