name: Build and push to ACR

on:
  push:
    branches:
      - feature/alok
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  version:
    #if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    if: github.event_name == 'push' 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: calculate next version tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          dry_run: true
      
      - name: Print version information
        run: |
          echo "Previous tag: ${{ steps.version.outputs.previous_tag }}"
          echo "Next tag: ${{ steps.version.outputs.new_tag }}"
          echo "Next version: ${{ steps.version.outputs.new_version }}"

  build:
    env:
          ACR_NAME: acreusdev01
          ACR_LOGIN_SERVER: acreusdev01.azurecr.io
    needs: version
    if: github.event_name == 'push' 
    #if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Build and push image
        uses: pandeyaws/shared-templates/.github/actions/build/python@feature/alok
        with:
          python-version: "3.12"
          enable-tests: "true"
          acr_name: acreusdev01
          acr_login_server: acreusdev01.azurecr.io
          image_name: my-python-app
          image_tag: ${{ needs.version.outputs.tag }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          

